; ReadyStack Harbor: the five Harbor processes of one non-root container. Every program logs to the
; container's stdout (docker logs); `supervisorctl status` shows them.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:registry]
command=/usr/local/bin/harbor-svc registry /usr/local/bin/registry serve /etc/harbor/registry/config.yml
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:registryctl]
command=/usr/local/bin/harbor-svc registryctl /harbor/harbor_registryctl -c /etc/harbor/registryctl/config.yml
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:core]
command=/usr/local/bin/harbor-svc core /harbor/harbor_core
directory=/harbor
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:jobservice]
command=/usr/local/bin/harbor-svc jobservice /harbor/harbor_jobservice -c /etc/harbor/jobservice/config.yml
directory=/harbor
priority=40
autorestart=true
; jobservice exits at once while core (127.0.0.1:8081) or Redis does not answer yet; on a first start core
; is still creating its database tables. Keep retrying instead of giving up after supervisord's default 3.
startretries=100
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/local/bin/harbor-svc nginx /usr/sbin/nginx -e stderr -c /etc/harbor/nginx.conf -g "daemon off;"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
